name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: |
        dotnet build app/GHelper4Peripherals.sln --configuration Release

    - name: Publish (single file)
      run: |
        dotnet publish app/GHelper4Peripherals.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    - name: Create ZIP
      run: |
        powershell Compress-Archive app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: GHelper4Peripherals
        path: |
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.zip
