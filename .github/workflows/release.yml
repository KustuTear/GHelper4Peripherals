name: Release

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Check tag matches version
      if: github.event_name == 'release'
      run: |
        $version = ([xml](Get-Content app/GHelper4Peripherals.csproj)).Project.PropertyGroup.AssemblyVersion
        $tag = "${{ github.event.release.tag_name }}"
        if ($tag -ne "v$version") { throw "Tag $tag does not match AssemblyVersion $version" }

    - name: Publish
      run: |
        dotnet publish app/GHelper4Peripherals.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    - name: Upload unsigned EXE
      if: env.SIGNPATH_API_TOKEN != ''
      id: upload-unsigned
      uses: actions/upload-artifact@v7
      with:
        name: GHelper4Peripherals-unsigned
        path: app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe

    - name: Sign EXE (SignPath)
      if: env.SIGNPATH_API_TOKEN != ''
      id: sign-exe
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        project-slug: ${{ secrets.SIGNPATH_PROJECT }}
        signing-policy-slug: ${{ secrets.SIGNPATH_POLICY }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: './signed'

    - name: Use signed EXE
      if: env.SIGNPATH_API_TOKEN != ''
      run: |
        Copy-Item ./signed/GHelper4Peripherals.exe app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: GHelper4Peripherals
        path: app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe

    - name: Create release (tag push)
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe --generate-notes

    - name: Upload to existing release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe --clobber

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper4Peripherals.exe
